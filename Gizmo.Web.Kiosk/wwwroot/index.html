<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Gizmo Kiosk</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <meta name="theme-color" content="#0d0f1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gizmo Kiosk" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link href="Gizmo.Web.Kiosk.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <style>
        #app-loading {
            position: fixed;
            inset: 0;
            background: #0d0f1c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
        }

        .app-loading__logo {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(200, 220, 255, 0.35);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app-loading__bar {
            width: 180px;
            height: 2px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
        }

        .app-loading__bar-fill {
            height: 100%;
            width: var(--blazor-load-percentage, 0%);
            background: linear-gradient(90deg, #2a5298, #5b8dee);
            border-radius: 2px;
            transition: width 0.15s ease;
        }

        .app-loading__dots {
            display: flex;
            gap: 8px;
        }

        .app-loading__dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(200, 220, 255, 0.25);
            animation: dot-pulse 1.4s ease-in-out infinite;
        }

        .app-loading__dot:nth-child(2) { animation-delay: 0.2s; }
        .app-loading__dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-pulse {
            0%, 80%, 100% { transform: scale(1);   opacity: 0.25; }
            40%            { transform: scale(1.5); opacity: 0.9;  }
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="app-loading">
            <div class="app-loading__logo">Gizmo Kiosk</div>
            <div class="app-loading__bar">
                <div class="app-loading__bar-fill"></div>
            </div>
            <div class="app-loading__dots">
                <div class="app-loading__dot"></div>
                <div class="app-loading__dot"></div>
                <div class="app-loading__dot"></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }

        // PWA install prompt
        window._pwaInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            window._pwaInstallPrompt = e;
            window.dispatchEvent(new Event('pwaInstallAvailable'));
        });
        window.addEventListener('appinstalled', () => {
            window._pwaInstallPrompt = null;
            window.dispatchEvent(new Event('pwaInstallDone'));
        });
        window.pwaInstall = async () => {
            if (!window._pwaInstallPrompt) return false;
            window._pwaInstallPrompt.prompt();
            const { outcome } = await window._pwaInstallPrompt.userChoice;
            if (outcome === 'accepted') window._pwaInstallPrompt = null;
            return outcome === 'accepted';
        };
        window.pwaCanInstall = () => !!window._pwaInstallPrompt;

        // Resize observer: notifies Blazor when the window size changes (debounced)
        window._resizeRef = null;
        window._resizeTimer = null;
        window.registerResizeCallback = (dotNetRef) => {
            window._resizeRef = dotNetRef;
            window.addEventListener('resize', () => {
                clearTimeout(window._resizeTimer);
                window._resizeTimer = setTimeout(() => {
                    if (window._resizeRef) {
                        window._resizeRef.invokeMethodAsync('OnWindowResize', window.innerWidth, window.innerHeight);
                    }
                }, 250);
            });
        };
        window.unregisterResizeCallback = () => {
            window._resizeRef = null;
        };

        // Apply persisted culture before Blazor starts so satellite assemblies load correctly
        const culture = localStorage.getItem('kiosk.culture');
        if (culture) {
            Blazor.start({
                loadAllSatelliteResources: true,
                applicationCulture: culture
            });
        } else {
            Blazor.start({ loadAllSatelliteResources: true });
        }
    </script>
</body>

</html>
